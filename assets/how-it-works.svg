<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-labelledby="title desc"><!-- Dextend project layout and integration: Overev | https://overev.com/ -->
<title id="title">Zasada działania Dextend</title>
<desc id="desc">Smartfon z Apple CarPlay lub Android Auto łączy się dwukierunkowo z pośrednikiem z dodatkiem Dextend. Pośrednik z przewodem USB łączy się dwukierunkowo z systemem multimedialnym motocykla, przedstawionym jako ekran o kształcie wyświetlacza testowanej Yamahy.</desc>
